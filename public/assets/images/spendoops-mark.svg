<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SpendOops logo mark</title>
  <desc id="desc">A playful violet wallet with a receipt and surprised face.</desc>

  <defs>
    <linearGradient id="walletGradient" x1="28" y1="38" x2="100" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B7BFF"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="receiptGradient" x1="62" y1="16" x2="83" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F5FF"/>
      <stop offset="1" stop-color="#E7E0FF"/>
    </linearGradient>
  </defs>

  <!-- receipt -->
  <path d="M58 20L65 17L70 21L75 17L80 21L85 18L91 23L86 57H52L58 20Z"
        fill="url(#receiptGradient)"/>
  <rect x="62" y="30" width="18" height="4" rx="2" fill="#A78BFA"/>
  <rect x="60" y="39" width="16" height="4" rx="2" fill="#A78BFA"/>

  <!-- wallet body -->
  <rect x="24" y="44" width="80" height="60" rx="18" fill="url(#walletGradient)"/>
  <rect x="28" y="46" width="48" height="5" rx="2.5" fill="#6D3EEB" opacity=".55"/>

  <!-- clasp -->
  <rect x="81" y="61" width="29" height="26" rx="10" fill="#5B35C9"/>
  <circle cx="94.5" cy="74" r="5.5" fill="#F7F4FF"/>

  <!-- face -->
  <ellipse cx="47" cy="76" rx="4" ry="6" fill="#3F237F"/>
  <ellipse cx="69" cy="76" rx="4" ry="6" fill="#3F237F"/>
  <path d="M52 90C54 82 62 82 65 90C66 93 64 96 61 96H56C53 96 51 93 52 90Z" fill="#3F237F"/>

  <!-- oops accent marks -->
  <rect x="24" y="34" width="5" height="12" rx="2.5" transform="rotate(-38 24 34)" fill="#7C4DFF"/>
  <rect x="33" y="28" width="5" height="13" rx="2.5" transform="rotate(-12 33 28)" fill="#7C4DFF"/>
</svg>
